name: Source links

# Weekly check that the sources the site cites are still reachable. Many government sites
# refuse automated requests (403) or rate-limit (429); those are reported, not failed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Collect source URLs
        run: node -e "const s=require('./research/timeline.json').flatMap(e=>e.sources).concat(require('./research/airframes.json').flatMap(a=>a.sources));require('fs').writeFileSync('urls.txt',[...new Set(s.map(x=>x.url))].join('\n'))"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --timeout 30 --accept 200..=299,403,429 urls.txt
          fail: false
          jobSummary: true
