name: Secrets

# The repository is public: every push and pull request is scanned, full history included, with
# gitleaks (pinned release, checksum verified). Local hooks in tools/git-hooks run the same scan
# before a commit or push leaves the machine; GitHub secret scanning with push protection is on too.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .
      - name: Local-only files never committed
        run: |
          if git log --all --name-only --format= | grep -E '^(\.mex/|CLAUDE\.md$|\.claude/skills/mex-)'; then
            echo "Local-only MEX memory files found in history" >&2; exit 1
          fi
