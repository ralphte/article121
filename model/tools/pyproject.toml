[project]
name = "article121-model-tools"
version = "0.1.0"
description = "Trace published SR-71 drawings into geometry and verify the 3D model against them"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "pillow>=11",
  "scipy>=1.14",
  "scikit-image>=0.24",
  "trimesh>=5.1.1",
]

[tool.uv]
package = false
